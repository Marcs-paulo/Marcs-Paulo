<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96"
     width="1000" height="96" role="img" aria-label="Vamos conversar">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22C55E"  stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C55E"  stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="30" width="920" height="2" rx="1" fill="url(#r)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4s"
             repeatCount="indefinite"/>
  </rect>
  <text x="500" y="66" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#8B949E"
        text-anchor="middle" letter-spacing="0.3">
