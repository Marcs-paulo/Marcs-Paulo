<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250"
     width="1000" height="250" role="img"
     aria-label="Marcos Paulo Dantas Joaquim - Engenharia de Computacao, UFRN.
                 Escreve da placa ao aplicativo.">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#000000" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1000" height="250" rx="16" fill="#FFFFFF"/>
  <rect width="1000" height="250" rx="16" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16"
        fill="none" stroke="#D0D7DE"/>

  <!-- identidade -->
  <text x="46" y="88" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="700"
        fill="#1F2328" letter-spacing="-0.5">Marcos Paulo Dantas Joaquim</text>
  <text x="48" y="120" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#15803D"
        letter-spacing="0.4">Engenharia de Computa&#231;&#227;o &#183; UFRN</text>
  <text x="48" y="158" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#1F2328"
        fill-opacity="0.9">Escrevo da placa ao aplicativo.</text>
  <text x="48" y="184" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#59636E">
    Sem depender de outra equipe para fechar o produto.
  </text>

  <!-- painel: as camadas de um produto de hardware -->
  <rect x="566" y="30" width="404" height="190" rx="12"
        fill="#F6F8FA" stroke="#D0D7DE"/>

  <!-- o colchete que abraca as cinco -->
  <path d="M614,54 h-8 v157 h8" fill="none" stroke="#15803D"
        stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="598" y="132" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#15803D"
        text-anchor="middle" transform="rotate(-90 598 132)"
        letter-spacing="1">EU ESCREVO</text>

  <rect x="638" y="54" width="308" height="25" rx="6"
        fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-opacity="0.28">
    <animate attributeName="fill-opacity" values="0.07;0.20;0.07"
             dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="654" y="71" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
        fill="#1F2328" fill-opacity="0.86">Aplicativo</text>
  <rect x="638" y="87" width="308" height="25" rx="6"
        fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-opacity="0.28">
    <animate attributeName="fill-opacity" values="0.07;0.20;0.07"
             dur="4.5s" begin="1.35s" repeatCount="indefinite"/>
  </rect>
  <text x="654" y="104" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
        fill="#1F2328" fill-opacity="0.86">API e banco de dados</text>
  <rect x="638" y="120" width="308" height="25" rx="6"
        fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-opacity="0.28">
    <animate attributeName="fill-opacity" values="0.07;0.20;0.07"
             dur="4.5s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="654" y="137" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
        fill="#1F2328" fill-opacity="0.86">Protocolo de comunica&#231;&#227;o</text>
  <rect x="638" y="153" width="308" height="25" rx="6"
        fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-opacity="0.28">
    <animate attributeName="fill-opacity" values="0.07;0.20;0.07"
             dur="4.5s" begin="0.45s" repeatCount="indefinite"/>
  </rect>
  <text x="654" y="170" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
        fill="#1F2328" fill-opacity="0.86">Firmware</text>
  <rect x="638" y="186" width="308" height="25" rx="6"
        fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-opacity="0.28">
    <animate attributeName="fill-opacity" values="0.07;0.20;0.07"
             dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <text x="654" y="203" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
        fill="#1F2328" fill-opacity="0.86">Placa</text>
</svg>
