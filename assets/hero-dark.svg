<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250"
     width="1000" height="250" role="img"
     aria-label="Marcos Paulo Dantas Joaquim - Engenharia de Computacao, UFRN">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#22C55E" stop-opacity="1"/>
      <stop offset="1"    stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="250" rx="16" fill="#0D1117"/>
  <rect width="1000" height="250" rx="16" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16"
        fill="none" stroke="#30363D"/>

  <!-- identidade -->
  <text x="46" y="82" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="33" font-weight="700"
        fill="#E6EDF3" letter-spacing="-0.6">Marcos Paulo Dantas Joaquim</text>
  <text x="48" y="118" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#22C55E"
        letter-spacing="0.4">Engenharia de Computa&#231;&#227;o &#183; UFRN</text>
  <text x="48" y="150" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#8B949E">
    Sistemas que precisam funcionar quando a infraestrutura falha.
  </text>
  <g>
    <rect x="48" y="172" width="128" height="26" rx="13"
          fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="112.0" y="189.5" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
          fill="#22C55E" text-anchor="middle">C++ / ESP-IDF</text>
  </g>
  <g>
    <rect x="188" y="172" width="118" height="26" rx="13"
          fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="247.0" y="189.5" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
          fill="#22C55E" text-anchor="middle">React Native</text>
  </g>
  <g>
    <rect x="318" y="172" width="116" height="26" rx="13"
          fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="376.0" y="189.5" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5"
          fill="#22C55E" text-anchor="middle">Rust / Tauri</text>
  </g>

  <!-- painel: o padrao que se repete nos projetos -->
  <rect x="586" y="34" width="384" height="182" rx="12"
        fill="#12171F" stroke="#30363D"/>
  <text x="604" y="58" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5"
        fill="#8B949E" letter-spacing="1.4">OFFLINE-FIRST</text>

  <!-- janela sem rede -->
  <rect x="688" y="70" width="184" height="126" rx="8"
        fill="#F59E0B" fill-opacity="0.09"
        stroke="#F59E0B" stroke-opacity="0.45" stroke-dasharray="4 4"/>
  <text x="780" y="88" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#F59E0B"
        text-anchor="middle" letter-spacing="1">SEM REDE</text>

  <!-- a linha e a fila -->
  <line x1="604" y1="104" x2="956" y2="104" stroke="#30363D" stroke-width="1.5"/>
  <line x1="604" y1="104" x2="956" y2="104" stroke="url(#fio)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;0.9;0.25"
             dur="3.6s" repeatCount="indefinite"/>
  </line>
  <line x1="724" y1="158" x2="836" y2="158" stroke="#22C55E" stroke-width="1.5"
        stroke-opacity="0.35" stroke-dasharray="3 4"/>
  <text x="780" y="178" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E"
        text-anchor="middle">fila local</text>

  <text x="604" y="96" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8B949E">dado</text>
  <text x="956" y="96" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#22C55E"
        text-anchor="end">sincronizado</text>

    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="0.0s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="0.0s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="0.72s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="0.72s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="1.44s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="1.44s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="2.16s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="2.16s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="2.88s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="2.88s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" rx="2" fill="#22C55E">
      <animateMotion dur="4.4s" begin="3.6s" repeatCount="indefinite"
                     path="M604,104 H688 C706,104 706,158 724,158 H836 C854,158 854,104 872,104 H956" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="4.4s" begin="3.6s"
               repeatCount="indefinite"
               values="0;1;1;1;1;0" keyTimes="0;0.06;0.4;0.7;0.94;1"/>
    </rect>

  <!-- nada se perde -->
  <text x="604" y="206" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8B949E">
    A rede cai. Nenhuma leitura se perde.
  </text>
</svg>
